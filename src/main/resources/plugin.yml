name: OpenMCMelody
version: '${version}'

main: io.github.jwyoon1220.openMCMelody.OpenMCMelody
api-version: '26.2'
load: POSTWORLD

permissions:
  openmcmelody.score.admin:
    description: List, play and stop songs for any player, and check any player's status.
    default: op
  openmcmelody.score.playlist:
    description: Manage and play shared playlists.
    default: true
  openmcmelody.score.status:
    description: Check your own current playback status.
    default: true
  openmcmelody.score.jukebox:
    description: Convert jukeboxes into song-playing jukeboxes and pick songs for them.
    default: true
